<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tech Store</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="store-name" href="/">Tech Store</a>
    </header>
    <main>
        <section class="intro" aria-labelledby="store-heading">
            <h1 id="store-heading">Build your workspace</h1>
            <p>Browse the catalog and place a demo order.</p>
        </section>

        <form id="login" hidden>
            <label for="password">Local storefront password</label>
            <div class="login-fields">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
            </div>
        </form>
        <a id="access-login" class="sign-in" href="/sign-in" hidden>Sign in</a>

        <p id="status" class="status" role="status">Loading catalog…</p>
        <ul id="products" class="products" aria-label="Products"></ul>
    </main>

    <template id="product-card">
        <li class="product">
            <h2></h2>
            <p class="description"></p>
            <div class="product-checkout">
                <span class="price"></span>
                <button type="button" disabled>Place order</button>
            </div>
        </li>
    </template>
</body>
</html>
