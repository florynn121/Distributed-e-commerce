x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-app-defaults: &app-defaults
  <<: *service-defaults
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - "/tmp:rw,nosuid,nodev,mode=1777"

x-rabbitmq-client: &rabbitmq-client
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  RABBITMQ_TLS: ${RABBITMQ_TLS:-false}

services:
  postgres:
    <<: *service-defaults
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 8s
      retries: 15
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - data

  order-service:
    <<: *app-defaults
    build: ./order-service
    environment:
      <<: *rabbitmq-client
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CHECKOUT_SERVICE_TOKEN: ${CHECKOUT_SERVICE_TOKEN:?Set CHECKOUT_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    stop_grace_period: 35s
    networks:
      - data

  ai-service:
    <<: *app-defaults
    build:
      context: ./ai-service
      target: worker
    environment: *rabbitmq-client
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "consumer.py", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 25s
    networks:
      - data

  api-gateway:
    <<: *app-defaults
    build: ./api-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AUTH_MODE: ${AUTH_MODE:-local}
      GATEWAY_LOGIN_PASSWORD: ${GATEWAY_LOGIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CHECKOUT_SERVICE_TOKEN: ${CHECKOUT_SERVICE_TOKEN:?Set CHECKOUT_SERVICE_TOKEN in .env}
      ORDER_SERVICE_URL: http://order-service:8080
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s
    networks:
      - edge
      - data

  qdrant:
    <<: *service-defaults
    image: qdrant/qdrant:v1.20.2
    profiles:
      - search
    environment:
      - QDRANT__SERVICE__API_KEY
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          read -r _ status _ <&3;
          test "$$status" = 200
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - data

  product-search:
    <<: *app-defaults
    build:
      context: ./ai-service
      target: search
    profiles:
      - search
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT__SERVICE__API_KEY:-}
      EMBEDDING_CACHE_DIR: /app/model-cache
      HF_HOME: /app/model-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    volumes:
      - search-model-data:/app/model-cache
    networks:
      - data
      - model-download

networks:
  edge:
  data:
    internal: true
  model-download:

volumes:
  postgres-data:
  rabbitmq-data:
  qdrant-data:
  search-model-data:
