name: Verify distributed checkout

on:
  push:
    branches: [main, production-edge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: order-service/pom.xml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api-gateway/package-lock.json
            edge/package-lock.json
      - name: Test order service
        working-directory: order-service
        run: bash ./mvnw --batch-mode verify
      - name: Test gateway
        working-directory: api-gateway
        run: npm ci && npm test
      - name: Test and bundle Worker
        working-directory: edge
        run: npm ci && npm test && npm run check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-worker.txt
      - name: Test event consumer
        working-directory: ai-service
        run: |
          python -m pip install -r requirements-worker.txt
          python -m unittest discover -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Start Compose stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
      - name: Verify checkout during a broker restart
        run: |
          set -a
          source .env
          set +a
          python3 scripts/checkout-smoke.py --broker-restart
      - name: Rehearse PostgreSQL recovery
        run: |
          python3 scripts/postgres-recovery.py backup "$RUNNER_TEMP/commerce.dump"
          python3 scripts/postgres-recovery.py verify "$RUNNER_TEMP/commerce.dump"
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
