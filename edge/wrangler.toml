name = "distributed-ecommerce-edge"
main = "src/worker.js"
compatibility_date = "2026-11-21"
workers_dev = false
preview_urls = false

[assets]
directory = "../api-gateway/public"
binding = "ASSETS"
run_worker_first = true

[secrets]
required = ["ORIGIN_URL", "ORIGIN_ACCESS_CLIENT_ID", "ORIGIN_ACCESS_CLIENT_SECRET", "EDGE_ORIGIN_TOKEN"]

[observability.logs]
enabled = true
invocation_logs = false
